[package]
name = "pares-agens"
description = "CLI for Pares Agens — includes the OpenClaw migration tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pares-agens"
path = "src/main.rs"

[lib]
name = "pares_agens_migrate"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pares-agens-core = { path = "../core", features = ["embeddings"] }
pares-agens-channels = { path = "../channels" }
pares-models = { path = "../models" }

[dev-dependencies]
tempfile = "3"
