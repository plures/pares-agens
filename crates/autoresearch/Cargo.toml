[package]
name = "pares-agens-autoresearch"
description = "Autonomous experiment loop for Pares Agens — hypothesis → mutate → execute → measure → keep/discard → repeat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
