[package]
name = "pares-agens-mesh"
description = "Neural mesh — distributed expert routing across a user's devices for Pares Agens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
async-trait = "0.1"
