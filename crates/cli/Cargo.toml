[package]
name = "pares-agens-cli"
description = "CLI binary for Pares Agens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pares-agens"
path = "src/main.rs"

[lib]
name = "pares_agens_migrate"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
pares-agens-core = { path = "../core", features = ["embeddings"] }
pares-radix-core = { git = "https://github.com/plures/pares-radix.git", tag = "v1.55.13" }
pares-agens-channels = { path = "../channels" }
pares-agens-models = { path = "../models" }
pares-agens-agenda = { path = "../agenda" }
pares-agens-tui = { path = "../tui" }
crossterm = "0.28"
ratatui = "0.29"

[dev-dependencies]
tempfile = "3"
