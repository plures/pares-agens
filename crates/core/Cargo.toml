[package]
name = "pares-agens-core"
description = "Cognition layer (agent, cerebellum, delegation, memory) for Pares Agens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Enable the spine integration test suite.
spine = []

## Enable the `VaultSecretStore` backed by plures-vault encrypted storage.
##
## When this feature is active, a `vault-core` dependency is pulled from the
## plures-vault git repository.  The default build omits this dependency so
## that `cargo check --workspace` succeeds without requiring the vault crate's
## transitive dependency tree.
vault = ["dep:vault-core"]

## Enable native fastembed embeddings via PluresDB.
## When active, `PluresDbStore::open_with_embeddings()` is available.
## Requires the `embeddings` feature on the `pluresdb` dependency.
embeddings = []

## Enable OpenTelemetry OTLP trace export.
## Adds gRPC span exporter that integrates with the tracing subscriber.
## Configure via OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME env vars.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
uuid.workspace = true
tracing.workspace = true
chrono.workspace = true
hostname = "0.4"
thiserror.workspace = true
reqwest.workspace = true
semver = "1"
toml = "1.1"
base64 = "0.23"
sha2 = "0.10"
pluresdb-px = { git = "https://github.com/plures/pluresdb", rev = "d08f88b5410384235f586320bafb89c4be3aa7a1" }
tiktoken-rs = "0.6"
unicode-segmentation = "1"
subtle = "2"
walkdir = "2"
# Cognition depends on the platform crate. In pares-radix this is a local path
# (`../radix-core`); here it is referenced via git and redirected to the local
# pares-radix checkout by the temporary [patch] block in the workspace root
# Cargo.toml (Stage S-C scaffolding — to be replaced by a real pin in S-F).
pares-radix-core = { git = "https://github.com/plures/pares-radix.git", tag = "v1.55.39" }
# Praxis (decision ledger / constraints) — same git+patch redirect as core.
pares-radix-praxis = { git = "https://github.com/plures/pares-radix.git", tag = "v1.55.39" }
# Privacy and audit are local crates in this (pares-agens) workspace.
pares-agens-privacy = { path = "../privacy" }
pares-agens-audit = { path = "../audit" }
pluresdb = { git = "https://github.com/plures/pluresdb", rev = "d08f88b5410384235f586320bafb89c4be3aa7a1", features = ["embeddings"] }
pluresdb-procedures = { git = "https://github.com/plures/pluresdb", rev = "d08f88b5410384235f586320bafb89c4be3aa7a1" }
pluresdb-sync = { git = "https://github.com/plures/pluresdb", rev = "d08f88b5410384235f586320bafb89c4be3aa7a1" }
pluresdb-sea = { git = "https://github.com/plures/pluresdb", rev = "d08f88b5410384235f586320bafb89c4be3aa7a1" }
vault-core = { git = "https://github.com/plures/plures-vault", rev = "d4e4783ddd14f63af2699ea97f29ca5895ef6590", package = "vault-core", optional = true }

regex = "1"
regex-lite = "0.1"
futures-util = "0.3"

# OpenTelemetry (optional, behind "otel" feature)
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry-semantic-conventions = { version = "0.28", optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "testing"] }
opentelemetry = { version = "0.28" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-opentelemetry = "0.29"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
