[package]
name = "agens-plugin"
description = "Pares Agens — thin plugin over pares-radix-as-a-library (CommandProvider + agens-brought IP: headroom, model/bitnet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pares-agens"
path = "src/bin/pares-agens.rs"

[dependencies]
# --- radix-as-a-library (PLATFORM capability surface) ---
# Platform crates STAY in radix. They are pinned to the LOCAL radix checkout
# (path deps) so the ENTIRE platform graph — core + mcp-server + cli/migrate +
# rector — compiles against the SINGLE local `pares_radix_core` (post-S-C
# split). Git-pinning these to rev 61b151b instead pulls the PRE-SPLIT snapshot
# (where ShellExecutor/StateStore/ChronosTimeline still lived in the old
# `crates/core` = pares-agens-core), which clashes with the local core's copies
# of those types (E0308 "similar names, distinct types"). Using local paths is
# consistent with the root [patch] that already redirects pares-radix-core /
# pares-radix-praxis -> the local radix checkout. (Real published pin bump is
# Stage S-F; at that point these revert to git pins against a PUSHED post-split
# radix.)
# NOTE: the host-composition runtime (run_with_providers) was RELOCATED into
# this crate (src/host_runtime/, Stage R3a) — pares-radix-cli-runtime is no
# longer a dependency.
pares-radix-cli-api     = { path = "C:/Projects/pares-radix/crates/cli-api" }
pares-radix-praxis      = { path = "C:/Projects/pares-radix/crates/praxis" }
# Platform crates pulled in by the relocated run_with_providers host machinery
# (Migrate -> pares_radix_migrate, Cluster -> pares_rector, McpServe ->
# pares_radix_mcp_server + pares_radix_core). LOCAL paths so they unify on the
# local pares_radix_core (see note above).
pares-radix-core        = { path = "C:/Projects/pares-radix/crates/radix-core" }
pares-radix-cli         = { path = "C:/Projects/pares-radix/crates/cli" }
pares-agens-mcp-server  = { path = "../mcp-server" }
pares-rector            = { path = "C:/Projects/pares-radix/crates/rector" }

# --- HOST / COGNITION crates (Option A: agens OWNS these) ---
# Stage R3a: flipped from radix git-pins (rev 61b151b) to the LOCAL agens copies.
# This collapses the two-`pares-agens-core` clash: previously these were git-pinned
# to the OLD radix copies while pares-agens-tui -> ../tui -> ../core dragged in the
# LOCAL core, yielding two distinct Agent/SessionManager/ModelClient types. With
# local paths there is exactly ONE pares-agens-core in the graph.
pares-agens-core        = { path = "../core", features = ["embeddings"] }
pares-agens-channels    = { path = "../channels" }
pares-agens-models      = { path = "../models" }
pares-agens-bitnet      = { path = "../bitnet", features = ["model-client"] }
pares-agens-agenda      = { path = "../agenda" }
pares-agens-tui         = { path = "../tui" }

# --- pluresdb (headroom + px executor types; pinned to the SAME revs radix core uses
#     so the ActionHandler/CrdtStore types unify across the graph) ---
pluresdb    = { git = "https://github.com/plures/pluresdb", rev = "111dc919c8c2f1d4da7a1b4a1bac0d5a73adf7a3", features = ["embeddings"] }
pluresdb-px = { git = "https://github.com/plures/pluresdb", rev = "195c67b" }

# --- headroom leaf deps ---
sha2 = "0.10"
tiktoken-rs = "0.6"
unicode-segmentation = "1"

# --- common ---
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# --- agent-command deps (carved from radix cli-runtime in Stage 4c) ---
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
html2text = "0.17"
crossterm = "0.28"
ratatui = "0.29"
toml = "0.8"

[features]
default = []
bitnet-native = ["pares-agens-bitnet/inference"]

[dev-dependencies]
tempfile = "3"
