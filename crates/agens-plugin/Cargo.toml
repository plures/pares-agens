[package]
name = "agens-plugin"
description = "Pares Agens — thin plugin over pares-radix-as-a-library (CommandProvider + agens-brought IP: headroom, model/bitnet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pares-agens"
path = "src/bin/pares-agens.rs"

[dependencies]
# --- radix-as-a-library (PLATFORM capability surface) ---
# Platform crates STAY in radix. They are git-pinned to the published pares-radix
# release tag (v1.49.2 == bf765f7, a descendant of the post-split f8eada7 carve)
# so the ENTIRE platform graph — core +
# cli/migrate + cli-api + praxis + rector — resolves against the SINGLE published
# `pares_radix_core`. A single shared tag across every radix edge (here and in the
# member crates) is what lets Cargo unify them into one source per crate (no
# duplicate `pares_radix_core` -> no E0308 "similar names, distinct types").
# NOTE: the host-composition runtime (run_with_providers) was RELOCATED into
# this crate (src/host_runtime/, Stage R3a) — pares-radix-cli-runtime is no
# longer a dependency.
pares-radix-cli-api     = { git = "https://github.com/plures/pares-radix.git", tag = "v1.49.2" }
pares-radix-praxis      = { git = "https://github.com/plures/pares-radix.git", tag = "v1.49.2" }
# Platform crates pulled in by the relocated run_with_providers host machinery
# (Migrate -> pares_radix_migrate, Cluster -> pares_rector, McpServe ->
# pares_radix_mcp_server + pares_radix_core). Same release tag so they unify on
# the single published pares_radix_core (see note above).
pares-radix-core        = { git = "https://github.com/plures/pares-radix.git", tag = "v1.49.2" }
pares-radix-cli         = { git = "https://github.com/plures/pares-radix.git", tag = "v1.49.2" }
pares-agens-mcp-server  = { path = "../mcp-server" }
pares-rector            = { git = "https://github.com/plures/pares-radix.git", tag = "v1.49.2" }

# --- HOST / COGNITION crates (Option A: agens OWNS these) ---
# Stage R3a: the cognition/host crates are the LOCAL agens copies (path deps).
# This collapses the two-`pares-agens-core` clash: with local paths there is
# exactly ONE pares-agens-core in the graph (Agent/SessionManager/ModelClient).
pares-agens-core        = { path = "../core", features = ["embeddings"] }
pares-agens-channels    = { path = "../channels" }
pares-agens-models      = { path = "../models" }
pares-agens-bitnet      = { path = "../bitnet", features = ["model-client"] }
pares-agens-agenda      = { path = "../agenda" }
pares-agens-tui         = { path = "../tui" }

# --- pluresdb (headroom + px executor types; pinned to the SAME revs radix core uses
#     so the ActionHandler/CrdtStore types unify across the graph) ---
pluresdb    = { git = "https://github.com/plures/pluresdb", rev = "111dc919c8c2f1d4da7a1b4a1bac0d5a73adf7a3", features = ["embeddings"] }
pluresdb-px = { git = "https://github.com/plures/pluresdb", rev = "0ec9523" }

# --- headroom leaf deps ---
sha2 = "0.10"
tiktoken-rs = "0.6"
unicode-segmentation = "1"

# --- common ---
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# --- agent-command deps (carved from radix cli-runtime in Stage 4c) ---
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
html2text = "0.17"
crossterm = "0.28"
ratatui = "0.29"
toml = "0.8"

[features]
default = []
bitnet-native = ["pares-agens-bitnet/inference"]

[dev-dependencies]
tempfile = "3"
