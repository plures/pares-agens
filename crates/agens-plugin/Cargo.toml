[package]
name = "agens-plugin"
description = "Pares Agens — thin plugin over pares-radix-as-a-library (CommandProvider + agens-brought IP: headroom, model/bitnet)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pares-agens"
path = "src/bin/pares-agens.rs"

[dependencies]
# --- radix-as-a-library (the host runtime + capability surface) ---
# Pinned to the PUSHED radix branch SHA so the cross-repo dep resolves in CI.
pares-radix-cli-runtime = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }
pares-radix-cli-api     = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }
pares-agens-core        = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171", features = ["embeddings"] }
pares-agens-channels    = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }
pares-models            = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }
pares-agens-bitnet      = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171", features = ["model-client"] }
pares-agens-agenda      = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }
pares-radix-tui         = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }
pares-radix-praxis      = { git = "https://github.com/plures/pares-radix.git", rev = "61b151bcbddc35995e10e1f35ef2dccc672a4171" }

# --- pluresdb (headroom + px executor types; pinned to the SAME revs radix core uses
#     so the ActionHandler/CrdtStore types unify across the graph) ---
pluresdb    = { git = "https://github.com/plures/pluresdb", rev = "111dc919c8c2f1d4da7a1b4a1bac0d5a73adf7a3", features = ["embeddings"] }
pluresdb-px = { git = "https://github.com/plures/pluresdb", rev = "195c67b" }

# --- headroom leaf deps ---
sha2 = "0.10"
tiktoken-rs = "0.6"
unicode-segmentation = "1"

# --- common ---
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# --- agent-command deps (carved from radix cli-runtime in Stage 4c) ---
reqwest.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
html2text = "0.17"
crossterm = "0.28"
ratatui = "0.29"
toml = "0.8"

[features]
default = []
bitnet-native = ["pares-agens-bitnet/inference"]

[dev-dependencies]
tempfile = "3"
