[package]
name = "pares-agens-gpu"
description = "GPU inference pool — multi-model BitNet on a single GPU"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enable real CUDA W1.58A8 kernel integration.  Without this feature every
# GPU call is handled by SimulatedModelBackend so that CI can run without a GPU.
cuda = []

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
