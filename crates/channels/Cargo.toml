[package]
name = "pares-agens-channels"
description = "Channel adapters (stdin, Telegram) for Pares Agens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
teloxide.workspace = true
reqwest.workspace = true
serde_json.workspace = true
serde = { workspace = true }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
pares-agens-core = { path = "../core" }
pares-radix-core = { git = "https://github.com/plures/pares-radix.git", rev = "f53f0a1" }
pares-agens-marketplace = { path = "../marketplace" }
pares-agens-agenda = { path = "../agenda" }
pares-rector = { git = "https://github.com/plures/pares-radix.git", rev = "f53f0a1", package = "pares-rector" }

[features]
default = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
pluresdb = { git = "https://github.com/plures/pluresdb", rev = "328e060016fdc67e704712cffd71fcd9c38bfbf7" }
