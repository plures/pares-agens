<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pares Agens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Memory Sidebar ─────────────────────────────────────────────── -->
    <aside id="memory-sidebar" class="sidebar" aria-label="Memory sidebar">
      <header class="sidebar-header">
        <span class="sidebar-icon">🧠</span>
        <h2>Memories</h2>
      </header>
      <ul id="memory-list" class="memory-list" aria-live="polite">
        <li class="memory-empty">No memories yet.</li>
      </ul>
    </aside>

    <!-- ── Chat Panel ──────────────────────────────────────────────────── -->
    <main id="chat-panel" class="chat-panel">
      <header class="chat-header">
        <span id="agent-status" class="status-dot online" title="Online"></span>
        <h1>Pares Agens</h1>
        <nav class="header-nav">
          <button id="btn-settings" class="icon-btn" title="Settings" aria-haspopup="dialog">⚙</button>
        </nav>
      </header>

      <section id="message-list" class="message-list" role="log" aria-live="polite" aria-label="Conversation">
        <div class="welcome-message">
          <p>Hello! I'm <strong>Pares Agens</strong>. How can I help you today?</p>
        </div>
      </section>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <textarea
          id="chat-input"
          class="chat-input"
          placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
          rows="1"
          aria-label="Message input"
          required
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" title="Send message">
          <span class="send-icon">➤</span>
        </button>
      </form>
    </main>

    <!-- ── Settings Dialog ────────────────────────────────────────────── -->
    <dialog id="settings-dialog" class="settings-dialog" aria-label="Settings">
      <div class="settings-layout">
        <header class="dialog-header">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="icon-btn close-btn" aria-label="Close settings">✕</button>
        </header>

        <!-- Tab navigation -->
        <nav class="settings-tabs" role="tablist" aria-label="Settings sections">
          <button role="tab" id="tab-btn-providers"   class="tab-btn active"
                  aria-controls="tab-panel-providers"   aria-selected="true">Model Providers</button>
          <button role="tab" id="tab-btn-routing"     class="tab-btn"
                  aria-controls="tab-panel-routing"     aria-selected="false">Routing</button>
          <button role="tab" id="tab-btn-channels"    class="tab-btn"
                  aria-controls="tab-panel-channels"    aria-selected="false">Channels</button>
          <button role="tab" id="tab-btn-preferences" class="tab-btn"
                  aria-controls="tab-panel-preferences" aria-selected="false">Preferences</button>
        </nav>

        <!-- Tab panels -->
        <div class="settings-body">
          <section id="tab-panel-providers"
                   role="tabpanel" aria-labelledby="tab-btn-providers"
                   class="tab-panel">
            <div id="providers-content"></div>
          </section>

          <section id="tab-panel-routing"
                   role="tabpanel" aria-labelledby="tab-btn-routing"
                   class="tab-panel" hidden>
            <div id="routing-content"></div>
          </section>

          <section id="tab-panel-channels"
                   role="tabpanel" aria-labelledby="tab-btn-channels"
                   class="tab-panel" hidden>
            <div id="channels-content"></div>
          </section>

          <section id="tab-panel-preferences"
                   role="tabpanel" aria-labelledby="tab-btn-preferences"
                   class="tab-panel" hidden>
            <div id="preferences-content"></div>
          </section>
        </div>

        <footer class="dialog-footer">
          <button type="button" id="btn-cancel-settings">Cancel</button>
          <button type="button" id="btn-save-settings" class="btn-primary">Save</button>
        </footer>
      </div>
    </dialog>

  </div><!-- /#app -->

  <script src="main.js" type="module"></script>
</body>
</html>
