<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pares Agens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Memory Sidebar ─────────────────────────────────────────────── -->
    <aside id="memory-sidebar" class="sidebar" aria-label="Memory sidebar">
      <header class="sidebar-header">
        <span class="sidebar-icon">🧠</span>
        <h2>Memories</h2>
      </header>
      <ul id="memory-list" class="memory-list" aria-live="polite">
        <li class="memory-empty">No memories yet.</li>
      </ul>
    </aside>

    <!-- ── Chat Panel ──────────────────────────────────────────────────── -->
    <main id="chat-panel" class="chat-panel">
      <header class="chat-header">
        <span id="agent-status" class="status-dot online" title="Online"></span>
        <h1>Pares Agens</h1>
        <nav class="header-nav">
          <button id="btn-procedures" class="icon-btn" title="Procedures" aria-haspopup="dialog">⚡</button>
          <button id="btn-settings" class="icon-btn" title="Settings" aria-haspopup="dialog">⚙</button>
        </nav>
      </header>

      <section id="message-list" class="message-list" role="log" aria-live="polite" aria-label="Conversation">
        <div class="welcome-message">
          <p>Hello! I'm <strong>Pares Agens</strong>. How can I help you today?</p>
        </div>
      </section>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <textarea
          id="chat-input"
          class="chat-input"
          placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
          rows="1"
          aria-label="Message input"
          required
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" title="Send message">
          <span class="send-icon">➤</span>
        </button>
      </form>
    </main>

    <!-- ── Settings Dialog ────────────────────────────────────────────── -->
    <dialog id="settings-dialog" class="settings-dialog" aria-label="Settings">
      <form method="dialog" id="settings-form">
        <header class="dialog-header">
          <h2>Settings</h2>
          <button class="icon-btn close-btn" value="cancel" aria-label="Close settings">✕</button>
        </header>

        <fieldset class="settings-section">
          <legend>Model</legend>
          <label>
            Model ID
            <input type="text" id="s-model" name="model" placeholder="qwen3:235b" />
          </label>
          <label>
            Endpoint URL
            <input type="url" id="s-endpoint" name="endpoint" placeholder="http://localhost:11434/v1" />
          </label>
          <label>
            System Prompt
            <textarea id="s-system-prompt" name="systemPrompt" rows="3"></textarea>
          </label>
        </fieldset>

        <fieldset class="settings-section">
          <legend>Channel</legend>
          <label>
            Active Channel
            <select id="s-channel" name="channel">
              <option value="tauri">tauri (desktop)</option>
              <option value="stdin">stdin</option>
              <option value="telegram">telegram</option>
            </select>
          </label>
        </fieldset>

        <footer class="dialog-footer">
          <button type="button" id="btn-cancel-settings" value="cancel">Cancel</button>
          <button type="button" id="btn-save-settings" class="btn-primary">Save</button>
        </footer>
      </form>
    </dialog>

    <!-- ── Procedure Editor Dialog ────────────────────────────────────── -->
    <dialog id="procedures-dialog" class="procedures-dialog" aria-label="Procedure Editor">
      <header class="dialog-header">
        <h2>⚡ Procedures</h2>
        <button class="icon-btn close-btn" id="btn-close-procedures" aria-label="Close procedure editor">✕</button>
      </header>

      <div class="procedures-body">

        <!-- Left: procedure list -->
        <aside class="proc-list-panel" aria-label="Procedure list">
          <div class="proc-list-toolbar">
            <select id="proc-template-select" aria-label="Select template" title="Select a template">
              <option value="">— New from template —</option>
              <option value="greeting">greeting</option>
              <option value="scheduled_task">scheduled task</option>
              <option value="approval_gate">approval gate</option>
              <option value="memory_pattern">memory pattern</option>
            </select>
            <button type="button" id="btn-create-proc" class="btn-primary" aria-label="Create procedure from template">＋</button>
          </div>
          <ul id="proc-list" class="proc-list" role="listbox" aria-label="Procedures"></ul>
        </aside>

        <!-- Right: editor + log -->
        <section class="proc-editor-panel" aria-label="Procedure editor">
          <!-- Placeholder when nothing is selected -->
          <div id="proc-empty" class="proc-empty">
            <p>Select a procedure to view or edit it.</p>
          </div>

          <!-- Editor view (hidden until a procedure is selected) -->
          <div id="proc-editor-view" class="proc-editor-view" hidden>
            <div class="proc-editor-toolbar">
              <div class="proc-meta">
                <span id="proc-detail-name" class="proc-detail-name"></span>
                <span id="proc-detail-type" class="proc-detail-type badge"></span>
              </div>
              <div class="proc-editor-actions">
                <label class="toggle-label" title="Enable / disable this procedure">
                  <input type="checkbox" id="proc-enabled-toggle" role="switch" aria-label="Enabled" />
                  <span class="toggle-track"><span class="toggle-thumb"></span></span>
                  <span class="toggle-text">Enabled</span>
                </label>
                <button type="button" id="btn-edit-proc" class="btn-secondary" aria-pressed="false">Edit</button>
                <button type="button" id="btn-save-proc" class="btn-primary" hidden>Save</button>
              </div>
            </div>

            <textarea
              id="proc-body"
              class="proc-body"
              spellcheck="false"
              aria-label="Procedure definition"
              readonly
            ></textarea>

            <!-- Execution log -->
            <details class="proc-log-section" open>
              <summary class="proc-log-summary">Execution Log</summary>
              <table class="proc-log-table" aria-label="Execution log">
                <thead>
                  <tr>
                    <th scope="col">Time</th>
                    <th scope="col">Duration</th>
                    <th scope="col">Trigger</th>
                  </tr>
                </thead>
                <tbody id="proc-log-body">
                  <tr><td colspan="3" class="log-empty">No executions recorded yet.</td></tr>
                </tbody>
              </table>
            </details>
          </div>
        </section>

      </div>
    </dialog>

  </div><!-- /#app -->

  <script src="main.js" type="module"></script>
</body>
</html>
