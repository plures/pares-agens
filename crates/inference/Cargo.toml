[package]
name = "pares-agens-inference"
description = "Streaming local inference and ModelClient trait for Pares Agens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enable native bitnet.cpp FFI linkage.  Requires the third_party/bitnet
# submodule and CMake ≥ 3.21 to be present.  Without this feature every
# generate call returns InferenceError::NativeUnavailable.
native = ["pares-agens-bitnet/inference"]

# Enable downloading models from Hugging Face Hub over HTTPS.
# Adds reqwest (rustls-tls) and serde_json as dependencies.
hf-download = ["dep:reqwest", "dep:serde_json", "dep:futures-util"]

[dependencies]
pares-agens-bitnet = { path = "../bitnet" }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

# Optional — only pulled in when the `hf-download` feature is enabled.
reqwest = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
serde_json = "1"
