[package]
name = "pares-agens-inference"
description = "Native local model inference via BitNet.cpp FFI for Pares Agens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Enable actual bitnet.cpp FFI linking.
##
## Requires the `crates/inference/bitnet.cpp` git submodule to be initialised:
##   git submodule update --init crates/inference/bitnet.cpp
default = []
native = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
reqwest.workspace = true
tracing.workspace = true
clap.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
