[package]
name = "pares-agens-desktop"
description = "Pares Agens desktop application — system tray agent node"
version = "0.5.0"
edition = "2021"
license = "BSL-1.1"
repository = "https://github.com/plures/pares-agens"

[lib]
name = "pares_agens_desktop"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
