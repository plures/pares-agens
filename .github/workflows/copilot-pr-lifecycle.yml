name: Copilot PR Lifecycle

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  issues:
    types: [opened, labeled]
  milestone:
    types: [closed]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    uses: plures/praxis-business/.github/workflows/copilot-pr-lifecycle-reusable.yml@main
    secrets:
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}

