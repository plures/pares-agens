name: Build All

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE', '.gitignore']

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Clean stale cargo artifacts
        run: rm -rf target

      # ADR-0015: build the FULL workspace so a duplicate `[[bin]] name` (link
      # collision, e.g. two `pares-agens` bins) fails CI. Building only
      # `-p pares-agens-cli` below would not catch a workspace link collision.
      # The GUI members (tauri/desktop) are excluded here because they need
      # GTK/WebKit system libs (gdk-sys -> zlib/pkg-config) that are absent on
      # this self-hosted runner; they are still compiled separately via
      # `cargo check` in the Tauri/Desktop steps below. Excluding them keeps the
      # link-collision guard for every real bin without failing on missing GTK.
      #
      # `openssl-sys` (pulled transitively via fastembed -> hf-hub -> native-tls
      # on the `embeddings` feature path) needs a system OpenSSL + pkg-config +
      # perl to build (either linked or vendored-from-source). None of those are
      # guaranteed present on the bare self-hosted runner shell, but the repo's
      # `nix develop` shell already provisions `openssl`/`pkg-config` (see
      # flake.nix devShells.default) for exactly this reason (the Tauri check
      # below already relies on it for GTK/WebKit). Run the build inside
      # `nix develop` so openssl-sys can link the system OpenSSL instead of
      # requiring libssl-dev/perl on the bare runner.
      - name: Build workspace (ADR-0015 collision guard)
        run: |
          nix develop --command bash -c 'cargo build --workspace --exclude pares-agens-tauri --exclude pares-agens-desktop' || \
          nix develop --command bash -c 'unset RUSTC_WRAPPER && cargo build --workspace --exclude pares-agens-tauri --exclude pares-agens-desktop'

      - name: Build CLI (release)
        run: |
          nix develop --command bash -c 'cargo build --release -p pares-agens-cli' || \
          nix develop --command bash -c 'unset RUSTC_WRAPPER && cargo build --release -p pares-agens-cli'

      - name: Install and restart
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.local/bin
          cp target/release/pares-agens ~/.local/bin/pares-agens
          sudo systemctl restart pares-agens || echo 'Service restart failed (may not be configured)'

      - name: Check TUI
        run: |
          nix develop --command bash -c 'cargo check -p pares-agens-tui' || \
          nix develop --command bash -c 'unset RUSTC_WRAPPER && cargo check -p pares-agens-tui'

      - name: Check Tauri app
        run: cargo check -p pares-agens-tauri || echo 'Tauri check skipped (missing GTK/Webkit deps on self-hosted)'
        continue-on-error: true

      - name: Check Desktop app
        run: cargo check -p pares-agens-desktop || echo 'Desktop check skipped (missing GTK/Webkit deps on self-hosted)'
        continue-on-error: true

      - name: Run tests
        run: |
          # Exclude tauri (needs GTK/Webkit which isn't available on this runner)
          nix develop --command bash -c 'cargo test \
            -p pares-agens-core \
            -p pares-agens-channels \
            -p pares-agens-models \
            -p pares-agens-cli \
            -p mcp-client \
            -p pares-agens-privacy \
            -p pares-agens-marketplace \
            -p pares-agens-agenda \
            -p pares-agens-sync \
            -p pares-agens-audit \
            -p pares-agens-tui \
            -- --skip network' || \
          nix develop --command bash -c 'unset RUSTC_WRAPPER && cargo test \
            -p pares-agens-core \
            -p pares-agens-channels \
            -p pares-agens-models \
            -p pares-agens-cli \
            -p mcp-client \
            -p pares-agens-privacy \
            -p pares-agens-marketplace \
            -p pares-agens-agenda \
            -p pares-agens-sync \
            -p pares-agens-audit \
            -p pares-agens-tui \
            -- --skip network'
        env:
          RUST_LOG: info
