name: Build All

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build CLI (release)
        run: cargo build --release -p pares-agens

      - name: Check TUI
        run: cargo check -p pares-agens-tui

      - name: Check Tauri app
        run: cargo check -p pares-agens-tauri

      - name: Check Desktop app
        run: cargo check -p pares-agens-desktop

      - name: Run tests
        run: cargo test --workspace -- --skip network
        env:
          RUST_LOG: info
