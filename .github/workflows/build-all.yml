name: Build All

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE', '.gitignore']

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build CLI (release)
        run: cargo build --release -p pares-agens-cli

      - name: Install and restart
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.local/bin
          cp target/release/pares-agens ~/.local/bin/pares-agens
          sudo systemctl restart pares-agens || echo 'Service restart failed (may not be configured)'

      - name: Check TUI
        run: cargo check -p pares-agens-tui

      - name: Check Tauri app
        run: cargo check -p pares-agens-tauri || echo 'Tauri check skipped (missing GTK/Webkit deps on self-hosted)'
        continue-on-error: true

      - name: Check Desktop app
        run: cargo check -p pares-agens-desktop || echo 'Desktop check skipped (missing GTK/Webkit deps on self-hosted)'
        continue-on-error: true

      - name: Run tests
        run: |
          # Exclude tauri (needs GTK/Webkit which isn't available on this runner)
          cargo test \
            -p pares-agens-core \
            -p pares-agens-channels \
            -p pares-models \
            -p pares-agens-cli \
            -p mcp-client \
            -p pares-agens-privacy \
            -p pares-agens-marketplace \
            -p pares-agens-agenda \
            -p pares-agens-praxis \
            -p pares-agens-sync \
            -p pares-agens-audit \
            -p pares-agens-tui \
            -- --skip network
        env:
          RUST_LOG: info
