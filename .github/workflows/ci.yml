name: CI
on:
  push:
    branches: [main, "copilot/**", "feature/**"]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  praxis:
    name: Praxis ADR enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR-0010 duplication check
        run: bash scripts/praxis-duplication-check.sh .
  ci:
    uses: plures/.github/.github/workflows/ci-reusable.yml@main
    with:
      # praxisbot's job shell is Nix-based and deliberately has no host apt
      # database. The reusable workflow's bare cargo steps therefore cannot
      # discover OpenSSL/pkg-config (or GTK for Tauri). Run the full Rust gates
      # inside this repo's flake devShell, which declares those dependencies.
      # These are equivalent required clippy and test gates, not skipped checks.
      skip_lint: true
      skip_test: true
      cargo_extra_check: |-
        # The self-hosted runner persists workspaces between jobs; discard stale
        # bare-runner artifacts before the Nix build and release them again on
        # exit (even on failure) to avoid exhausting its disk, which otherwise
        # makes a later job fail during `Set up job`.
        rm -rf target
        trap 'rm -rf target' EXIT
        nix develop --command bash -c 'unset RUSTC_WRAPPER SCCACHE_GHA_ENABLED; cargo clippy --workspace --all-targets --exclude pares-agens-tauri -- -D warnings'
        nix develop --command bash -c 'unset RUSTC_WRAPPER SCCACHE_GHA_ENABLED; cargo check --manifest-path crates/tauri-app/Cargo.toml'
        nix develop --command bash -c 'unset RUSTC_WRAPPER SCCACHE_GHA_ENABLED; cargo test --workspace --exclude pares-agens-tauri'
