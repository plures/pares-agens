name: CI
on:
  push:
    branches: [main, "copilot/**", "feature/**"]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  praxis:
    name: Praxis ADR enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR-0010 duplication check
        run: bash scripts/praxis-duplication-check.sh .
  ci:
    uses: plures/.github/.github/workflows/ci-reusable.yml@main
    with:
      # `ci / rust` runs clippy/test in the reusable workflow's bare runner
      # environment (outside `nix develop`). Install OpenSSL + pkg-config there
      # so `openssl-sys` (via fastembed -> hf-hub native-tls path) can resolve
      # `openssl.pc` and compile successfully.
      extra_apt_packages: "libssl-dev pkg-config perl"
      # ADR-0015: the GUI crates (tauri/desktop) pull gdk-sys, which needs GTK
      # system libs (gdk-3.0 -> zlib) that require the Nix devShell. The reusable
      # clippy/check steps run in the bare runner env, so exclude the GUI crates
      # here and lint/check them separately under `nix develop` (cargo_extra_check).
      cargo_clippy_flags: "--workspace --all-targets --exclude pares-agens-tauri -- -D warnings"
      cargo_check_flags: "--workspace --exclude pares-agens-tauri"
      cargo_extra_check: |-
        nix develop --command bash -c 'cargo check --manifest-path crates/tauri-app/Cargo.toml' || nix develop --command bash -c 'unset RUSTC_WRAPPER && cargo check --manifest-path crates/tauri-app/Cargo.toml'
