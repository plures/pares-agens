name: CI
on:
  push:
    branches: [main, "copilot/**", "feature/**"]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  pull_request:
    paths:
      - 'crates/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'devenv.nix'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  praxis:
    name: Praxis ADR enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR-0010 duplication check
        run: bash scripts/praxis-duplication-check.sh .
  ci:
    uses: plures/.github/.github/workflows/ci-reusable.yml@main
    with:
      extra_apt_packages: "libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev"
      cargo_extra_check: |-
        nix develop --command bash -c 'cargo check --manifest-path crates/tauri-app/Cargo.toml' || nix develop --command bash -c 'unset RUSTC_WRAPPER && cargo check --manifest-path crates/tauri-app/Cargo.toml'
