name: Org Proactive Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.COPILOT_PAT || secrets.PLURES_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check required secrets
        id: preflight
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing GitHub token; aborting monitor run"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing Telegram secrets; monitor scan will run but alerts are disabled"
            echo "alerts_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "alerts_enabled=true" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Monitor org PRs and CI
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          stalled_cutoff="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          ci_cutoff="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"

          stalled_file="$(mktemp)"
          ci_file="$(mktemp)"

          repos_scanned=0
          total_open_prs=0

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            full_repo="plures/$repo"
            repos_scanned=$((repos_scanned + 1))

            pr_json="$(gh pr list -R "$full_repo" --state open --limit 100 --json number,title,url,updatedAt,author)"
            open_count="$(jq 'length' <<<"$pr_json")"
            total_open_prs=$((total_open_prs + open_count))

            jq --arg repo "$full_repo" --arg cutoff "$stalled_cutoff" -r '
              .[]
              | select(
                  (
                    .author.login == "Copilot"
                    or .author.login == "copilot-swe-agent[bot]"
                    or .author.login == "app/copilot-swe-agent"
                    or (.author.login | test("copilot"; "i"))
                  )
                  and .updatedAt < $cutoff
                )
              | "- [\($repo)] PR #\(.number): \(.title)\n  \(.url)\n  last update: \(.updatedAt)"
            ' <<<"$pr_json" >> "$stalled_file"

            gh run list -R "$full_repo" --status failure --limit 20 --json workflowName,displayTitle,url,updatedAt \
              | jq --arg repo "$full_repo" --arg cutoff "$ci_cutoff" -r '
                  .[]
                  | select(.updatedAt >= $cutoff)
                  | "- [\($repo)] \(.workflowName): \(.displayTitle)\n  \(.url)\n  failed at: \(.updatedAt)"
                ' >> "$ci_file"
          done < <(
            gh repo list plures --limit 200 --json name,isFork,isArchived \
              --jq '.[] | select(.isFork == false and .isArchived == false) | .name'
          )

          stalled_count="$(grep -c '^- ' "$stalled_file" || true)"
          ci_count="$(grep -c '^- ' "$ci_file" || true)"

          echo "Scanned $repos_scanned repos; open PRs: $total_open_prs; stalled Copilot PRs: $stalled_count; recent CI failures: $ci_count"

          if [ "$stalled_count" -eq 0 ] && [ "$ci_count" -eq 0 ]; then
            echo "No proactive issues found"
            exit 0
          fi

          if [ "${{ steps.preflight.outputs.alerts_enabled }}" != "true" ]; then
            echo "Alerts disabled due to missing Telegram secrets"
            exit 0
          fi

          message_file="$(mktemp)"
          {
            printf '🚨 Pares Agens proactive monitor\n'
            printf 'time: %s\n' "$now"
            printf 'repos scanned: %s\n' "$repos_scanned"
            printf 'open PRs: %s\n\n' "$total_open_prs"

            if [ "$stalled_count" -gt 0 ]; then
              printf 'Stalled Copilot PRs (>2h no progress): %s\n' "$stalled_count"
              head -n 20 "$stalled_file"
              printf '\n'
            fi

            if [ "$ci_count" -gt 0 ]; then
              printf 'Recent CI failures (last 30m): %s\n' "$ci_count"
              head -n 20 "$ci_file"
            fi
          } > "$message_file"

          message="$(cat "$message_file")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true"

          echo "Telegram alert sent"
