name: Coverage

on:
  push:
    branches: [main, "copilot/**", "feature/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo llvm-cov (≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        # Exclude crates that require GTK / Tauri system libraries which are
        # not available in the default ubuntu-latest runner.
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude pares-agens-desktop \
            --exclude pares-agens-tauri \
            --lcov \
            --output-path lcov.info

      - name: Check coverage threshold (≥80%)
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude pares-agens-desktop \
            --exclude pares-agens-tauri \
            --summary-only \
            --fail-under-coverage 80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 14

      - name: Post coverage summary
        if: always()
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude pares-agens-desktop \
            --exclude pares-agens-tauri \
            --summary-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
