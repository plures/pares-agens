name: Coverage

on:
  push:
    branches: [main, "copilot/**", "feature/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo llvm-cov (≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        # Exclude crates that require GTK / Tauri system libraries which are
        # not available in the default ubuntu-latest runner.
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude pares-agens-desktop \
            --exclude pares-agens-tauri \
            --lcov \
            --output-path lcov.info

      - name: Check coverage threshold (≥80%)
        run: |
          # Parse the LCOV report to compute overall line-coverage percentage.
          # Summing LF (lines found) and LH (lines hit) across all source files
          # avoids re-running the full test suite a second time and does not
          # depend on a --fail-under-coverage flag that varies between
          # cargo-llvm-cov versions.
          LF=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' lcov.info)
          LH=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' lcov.info)
          if [ "$LF" -eq 0 ]; then
            echo "::error::No coverage data found in lcov.info"
            exit 1
          fi
          COVERAGE=$(( 100 * LH / LF ))
          echo "Line coverage: ${COVERAGE}% (${LH}/${LF} lines hit)"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets the ≥80% threshold ✓"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 14

      - name: Post coverage summary
        if: always()
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude pares-agens-desktop \
            --exclude pares-agens-tauri \
            --summary-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
