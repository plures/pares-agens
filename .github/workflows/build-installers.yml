name: Build Installers

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x86-64: MSI ─────────────────────────────────────────
          - name: Windows MSI
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundle_target: msi
            artifact_glob: "crates/desktop/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi"

          # ── macOS universal: DMG ────────────────────────────────────────
          - name: macOS DMG (universal)
            platform: macos-latest
            rust_target: universal-apple-darwin
            toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle_target: dmg
            artifact_glob: "crates/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg"

          # ── Linux x86-64: AppImage + deb + rpm ─────────────────────────
          - name: Linux AppImage
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundle_target: appimage,deb,rpm
            artifact_glob: |
              crates/desktop/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              crates/desktop/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              crates/desktop/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      # ── Rust toolchain ─────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          targets: ${{ matrix.toolchain_targets || matrix.rust_target }}

      # macOS universal binary needs both architectures (already set via toolchain_targets)
      - name: Add macOS aarch64 target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # ── Cargo / Tauri cache ────────────────────────────────────────────
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      # ── Linux system dependencies ──────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      # ── Tauri CLI (cached) ─────────────────────────────────────────────
      - name: Cache tauri-cli binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: ${{ runner.os }}-tauri-cli-2.10.0

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "2.10.0" --locked

      # ── macOS code signing ─────────────────────────────────────────────
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE}" ]]; then
            echo "APPLE_CERTIFICATE not set – skipping code signing"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "" build.keychain

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build and bundle (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle_target }} --locked

      # ── Windows code signing (SignPath) ───────────────────────────────
      - name: Sign MSI (SignPath)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        run: |
          if [[ -z "${SIGNPATH_API_TOKEN}" ]]; then
            echo "SIGNPATH_API_TOKEN not set – skipping code signing"
            exit 0
          fi
          MSI=$(ls crates/desktop/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi)
          bash scripts/sign-windows.sh "${MSI}"

      - name: Build and bundle (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: crates/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle_target }} --locked

      - name: Build and bundle (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: crates/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle_target }} --locked

      # ── Upload artifacts ───────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # ── Create / update GitHub Release ───────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    # Only publish a release on tag pushes or manual dispatch (not branch pushes).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pares Agens ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: installers/**
          generate_release_notes: true
