name: CI Feedback Loop

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  ci-feedback:
    name: Post-Merge CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace 2>&1
        continue-on-error: true
        id: check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings 2>&1
        continue-on-error: true
        id: clippy
      - name: Test
        run: cargo test --workspace 2>&1
        continue-on-error: true
        id: test

      - name: Feed CI results into expectation system
        if: steps.check.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.COMMIT_SHA;
            const msg = process.env.COMMIT_MSG;
            const steps = { check: process.env.CHECK_OUTCOME, clippy: process.env.CLIPPY_OUTCOME, test: process.env.TEST_OUTCOME };
            const failures = Object.entries(steps).filter(([_, o]) => o === 'failure').map(([n]) => n);
            if (failures.length === 0) return;
            const prMatch = msg.match(/#(\d+)/);
            const prRef = prMatch ? `PR #${prMatch[1]}` : `commit ${sha.substring(0, 7)}`;
            for (const label of ['ci-feedback', 'expectation-violation']) {
              try { await github.rest.issues.getLabel({ owner, repo, name: label }); } catch (_) {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: label === 'ci-feedback' ? 'fbca04' : 'd93f0b' }).catch(() => {});
              }
            }
            const issue = await github.rest.issues.create({
              owner, repo,
              title: `[ci-feedback] Post-merge failure: ${failures.join(', ')}`,
              body: `## Post-Merge CI Failure\n\n| Field | Value |\n|---|---|\n| **Source** | ${prRef} |\n| **Commit** | \`${sha}\` |\n| **Failed** | ${failures.join(', ')} |\n\nAuto-assigned to Copilot for fix.`,
              labels: ['ci-feedback', 'expectation-violation'],
            });
            try {
              const node = await github.graphql(`query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){id}}}`, {o:owner,r:repo,n:issue.data.number});
              await github.graphql(`mutation($id:ID!){addAssigneesToAssignable(input:{assignableId:$id,assigneeIds:["BOT_kgDOC9w8XQ"]}){clientMutationId}}`, {id:node.repository.issue.id});
            } catch(e) { core.info(`Could not assign: ${e.message}`); }
