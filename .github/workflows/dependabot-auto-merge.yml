name: Dependabot Auto-Merge

# This repo delegates dependabot auto-merge policy to the shared org template.
# See plures/.github/.github/workflows/dependabot-auto-merge.yml for the full policy.
# Requires the shared template to expose `on: workflow_call` (do not merge this PR before that lands).
# After that change lands, prefer pinning `jobs.auto-merge.uses` to a specific tag/SHA (not a moving branch).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: plures/.github/.github/workflows/dependabot-auto-merge.yml@main
    secrets: inherit
