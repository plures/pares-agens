name: Dependabot Auto-Merge

# This repo delegates dependabot auto-merge policy to the shared org template.
# See plures/.github/.github/workflows/dependabot-auto-merge.yml for the full policy.
# Requires the shared template to expose `on: workflow_call` (do not merge this PR before that lands).
# Pinned to an immutable commit SHA to avoid moving-branch supply-chain/reproducibility risk.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: plures/.github/.github/workflows/dependabot-auto-merge.yml@9c7f19fdb1505e1bd6b755328a0ba40da796b0da
