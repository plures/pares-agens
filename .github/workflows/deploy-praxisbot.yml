name: Deploy to Praxisbot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        env:
          SCCACHE_DIR: /tmp/sccache
          RUSTC_WRAPPER: ""
        run: |
          # Disable sccache for deploy builds (NixOS read-only store issue)
          unset RUSTC_WRAPPER
          cargo build --release -p pares-agens
          ls -lh target/release/pares-agens

      - name: Install binary
        run: |
          sudo mkdir -p /usr/local/bin
          sudo cp target/release/pares-agens /usr/local/bin/pares-agens
          sudo chmod +x /usr/local/bin/pares-agens
          echo "Installed to /usr/local/bin/pares-agens"

      - name: Create systemd system service
        run: |
          sudo tee /etc/systemd/system/pares-agens.service > /dev/null << 'UNIT'
          [Unit]
          Description=Pares Agens — AI Agent Daemon
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/pares-agens serve --copilot --telegram-token ${{ secrets.PARES_TELEGRAM_TOKEN }} --brave-api-key ${{ secrets.BRAVE_API_KEY }}
          Environment=RUST_LOG=info
          Restart=on-failure
          RestartSec=10
          WorkingDirectory=/var/lib/pares-agens

          # Run as a dedicated service user for isolation
          DynamicUser=yes
          StateDirectory=pares-agens

          [Install]
          WantedBy=multi-user.target
          UNIT

      - name: Enable and start service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable pares-agens
          sudo systemctl restart pares-agens
          sleep 8
          sudo systemctl status pares-agens --no-pager || true
          echo "=== Recent logs ==="
          sudo journalctl -u pares-agens -n 20 --no-pager || true

      - name: Verify bot is responding
        run: |
          if pgrep -f "pares-agens serve" > /dev/null; then
            echo "✅ pares-agens is running"
          else
            echo "❌ pares-agens NOT running"
            sudo journalctl -u pares-agens -n 50 --no-pager || true
            exit 1
          fi
