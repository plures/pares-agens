name: Deploy to Praxisbot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        env:
          SCCACHE_DIR: /tmp/sccache
          RUSTC_WRAPPER: ""
        run: |
          # Disable sccache for deploy builds (NixOS read-only store issue)
          unset RUSTC_WRAPPER
          cargo build --release -p pares-agens
          ls -lh target/release/pares-agens

      - name: Install binary
        run: |
          mkdir -p $HOME/.local/bin
          cp target/release/pares-agens $HOME/.local/bin/pares-agens
          chmod +x $HOME/.local/bin/pares-agens
          echo "Installed to $HOME/.local/bin/pares-agens"

      - name: Create systemd user service
        run: |
          mkdir -p $HOME/.config/systemd/user
          cat > $HOME/.config/systemd/user/pares-agens.service << EOF
          [Unit]
          Description=Pares Agens — AI Agent Daemon
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart=$HOME/.local/bin/pares-agens serve --copilot --telegram-token ${{ secrets.PARES_TELEGRAM_TOKEN }} --brave-api-key ${{ secrets.BRAVE_API_KEY }}
          Environment=RUST_LOG=info
          Restart=on-failure
          RestartSec=10
          WorkingDirectory=$HOME

          [Install]
          WantedBy=default.target
          EOF

      - name: Enable and start service
        run: |
          systemctl --user daemon-reload
          systemctl --user enable pares-agens
          systemctl --user restart pares-agens
          sleep 8
          systemctl --user status pares-agens --no-pager || true
          echo "=== Recent logs ==="
          journalctl --user -u pares-agens -n 20 --no-pager || true

      - name: Verify bot is responding
        run: |
          if pgrep -f "pares-agens serve" > /dev/null; then
            echo "✅ pares-agens is running"
          else
            echo "❌ pares-agens NOT running"
            journalctl --user -u pares-agens -n 50 --no-pager || true
            exit 1
          fi
