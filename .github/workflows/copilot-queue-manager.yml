name: Copilot Issue Queue Manager
# Assigns Copilot to ONE issue at a time from the backlog.
# When a Copilot PR merges/closes, assigns the next priority issue.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      force:
        description: "Force assign even if Copilot has open PR"
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3158960
          private-key: ${{ secrets.PRAXIS_BOT_PRIVATE_KEY }}
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const force = context.payload.inputs?.force === 'true';
            const COPILOT_BOT_ID = 'BOT_kgDOC9w8XQ';

            // Step 1: Check if Copilot already has an open PR
            if (!force) {
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              const copilotPR = prs.data.find(pr =>
                ['Copilot', 'copilot-swe-agent[bot]', 'app/copilot-swe-agent'].includes(pr.user.login)
              );
              if (copilotPR) {
                core.info(`Copilot has open PR #${copilotPR.number} — waiting`);
                return;
              }
            }

            // Step 2: Check if Copilot is already assigned to any open issue
            const allIssues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100, sort: 'created', direction: 'asc',
            });
            const copilotAssigned = allIssues.data.filter(i =>
              !i.pull_request && i.assignees.some(a => a.login === 'Copilot')
            );
            if (copilotAssigned.length > 0 && !force) {
              core.info(`Copilot already assigned to #${copilotAssigned[0].number} — waiting`);
              return;
            }

            // Step 3: Find next unassigned milestone issue
            const SKIP_LABELS = new Set(['ci-feedback', 'expectation-violation', 'wontfix', 'duplicate', 'copilot-queued']);
            const candidates = allIssues.data.filter(i => {
              if (i.pull_request) return false;
              if (i.labels.some(l => SKIP_LABELS.has(l.name))) return false;
              if (i.assignees.some(a => a.login === 'Copilot')) return false;
              if (!i.milestone) return false; // Only milestone issues
              return true;
            });

            // Sort: lowest milestone number first, then issue number
            candidates.sort((a, b) => {
              if (a.milestone.number !== b.milestone.number)
                return a.milestone.number - b.milestone.number;
              return a.number - b.number;
            });

            if (candidates.length === 0) {
              core.info('No eligible issues — all done or all assigned');
              return;
            }

            const target = candidates[0];
            core.info(`Next issue: #${target.number} "${target.title}" (${target.milestone.title})`);

            // Step 4: Assign Copilot via GraphQL
            try {
              await github.graphql(`mutation($id:ID!){
                addAssigneesToAssignable(input:{assignableId:$id,assigneeIds:["${COPILOT_BOT_ID}"]}){clientMutationId}
              }`, { id: target.node_id });
              core.info(`✅ Assigned Copilot to #${target.number}`);
            } catch (e) {
              core.warning(`GraphQL assign failed: ${e.message}`);
            }

            // Step 5: Nudge with @mention
            await github.rest.issues.createComment({
              owner, repo, issue_number: target.number,
              body: `@copilot Please implement this issue now. Build against current main branch.`,
            });
            core.info(`✅ Nudged Copilot on #${target.number}`);
