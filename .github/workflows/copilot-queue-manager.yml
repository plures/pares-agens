name: Copilot Issue Queue Manager
# Copilot SWE agent only triggers on FRESH issue creation with assignment.
# API-based reassignment doesn't trigger it.
# 
# This workflow:
# 1. Watches for Copilot PR merge/close events
# 2. Finds next priority feature issue
# 3. Creates a NEW implementation issue referencing the parent
# 4. The new issue triggers Copilot via creation-time assignment

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to queue for Copilot"
        type: number
        required: false
      force:
        description: "Force even if Copilot has open PR"
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3158960
          private-key: ${{ secrets.PRAXIS_BOT_PRIVATE_KEY }}
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const force = context.payload.inputs?.force === 'true';
            const specificIssue = context.payload.inputs?.issue_number;

            // Step 1: Check for open Copilot PR
            if (!force) {
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
              const copilotPR = prs.data.find(pr =>
                ['Copilot', 'app/copilot-swe-agent', 'copilot-swe-agent[bot]'].includes(pr.user.login)
              );
              if (copilotPR) {
                core.info(`Copilot has open PR #${copilotPR.number} — waiting`);
                return;
              }
            }

            // Step 2: Find target issue
            let targetIssue;
            if (specificIssue) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: parseInt(specificIssue) });
              targetIssue = data;
            } else {
              const issues = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', per_page: 100,
                sort: 'created', direction: 'asc',
              });

              const SKIP_LABELS = new Set(['ci-feedback', 'expectation-violation', 'wontfix', 'duplicate', 'copilot-queued']);
              const candidates = issues.data.filter(issue => {
                if (issue.pull_request) return false;
                if (issue.labels.some(l => SKIP_LABELS.has(l))) return false;
                return true;
              });

              candidates.sort((a, b) => {
                const aMs = a.milestone ? 0 : 1;
                const bMs = b.milestone ? 0 : 1;
                if (aMs !== bMs) return aMs - bMs;
                // Within milestone, sort by milestone number then issue number
                if (a.milestone && b.milestone && a.milestone.number !== b.milestone.number)
                  return a.milestone.number - b.milestone.number;
                return a.number - b.number;
              });

              // Skip issues that already have a "copilot-queued" child
              for (const candidate of candidates) {
                // Check if we already created a child issue for this
                const search = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} is:issue "Parent: #${candidate.number}" label:copilot-queued state:open`,
                });
                if (search.data.total_count === 0) {
                  targetIssue = candidate;
                  break;
                } else {
                  core.info(`#${candidate.number}: already has queued child, skipping`);
                }
              }
            }

            if (!targetIssue) {
              core.info('No eligible issues found');
              return;
            }

            // Step 3: Create fresh implementation issue
            // This is what triggers Copilot — new issue creation with assignment
            const parentBody = targetIssue.body || 'See parent issue for details.';
            const newIssue = await github.rest.issues.create({
              owner, repo,
              title: targetIssue.title,
              body: `Parent: #${targetIssue.number}\n\n---\n\n${parentBody}`,
              labels: [...targetIssue.labels.map(l => l.name).filter(l => l !== 'copilot-queued'), 'copilot-queued'],
              milestone: targetIssue.milestone?.number || null,
              assignees: ['kayodebristol'],
            });

            // Assign Copilot via GraphQL (the creation-time assignment IS the trigger)
            try {
              const nodeId = newIssue.data.node_id;
              await github.graphql(`mutation($id:ID!){addAssigneesToAssignable(input:{assignableId:$id,assigneeIds:["BOT_kgDOC9w8XQ"]}){clientMutationId}}`, { id: nodeId });
            } catch (e) {
              core.warning(`GraphQL assign failed: ${e.message}`);
            }

            // Add comment on parent linking to child
            await github.rest.issues.createComment({
              owner, repo, issue_number: targetIssue.number,
              body: `🤖 Queued for Copilot implementation → #${newIssue.data.number}`,
            });

            core.info(`✅ Created #${newIssue.data.number} for Copilot (parent: #${targetIssue.number})`);
