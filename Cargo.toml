[workspace]
resolver = "2"
members = ["crates/core", "crates/channels", "crates/models", "crates/mcp-client", "crates/migrate", "crates/trainer", "crates/privacy", "crates/marketplace", "crates/arca", "crates/faber", "crates/agenda", "crates/optimizer", "crates/praxis", "crates/sync", "crates/service", "crates/autoresearch", "crates/bitnet-sys", "crates/bitnet", "crates/inference", "crates/audit", "crates/gpu", "crates/dmem"]
# Tauri desktop app crates require GTK/WebKit system libraries on Linux.
# Excluding them from the workspace allows `cargo check --workspace` to run
# on systems without those libraries installed (e.g. CI without display, QA).
# They are built separately by build-installers.yml via `cargo tauri build`.
exclude = ["crates/tauri-app", "crates/desktop"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "BSL-1.1"
repository = "https://github.com/plures/pares-agens"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
teloxide = { version = "0.13", features = ["macros", "throttle"] }
clap = { version = "4", features = ["derive"] }
