[workspace]
resolver = "2"
members = ["crates/core", "crates/channels", "crates/models", "crates/mcp-client", "crates/cli", "crates/privacy", "crates/marketplace", "crates/agenda", "crates/praxis", "crates/sync", "crates/audit", "crates/tauri-app", "crates/tui", "crates/agens-plugin", "crates/bitnet-sys", "crates/bitnet", "crates/mcp-server"]
# Keep the Tauri desktop app crates in the workspace so their dependency graph
# is captured in the root Cargo.lock. They may still be built separately by
# installer workflows via `cargo tauri build --locked`, but the lockfile must
# already include the Tauri/GTK/WebKit dependencies for locked builds to work.

[workspace.package]
version = "1.14.0"
edition = "2021"
license = "BSL-1.1"
repository = "https://github.com/plures/pares-agens"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
teloxide = { version = "0.17", features = ["macros", "throttle"] }
clap = { version = "4", features = ["derive", "env"] }

# ---------------------------------------------------------------------------
# TEMPORARY Stage S-C scaffolding (DO NOT SHIP / revert before S-F).
#
# Stage S-C relocates the canonical cognition from pares-radix into this repo
# (crates/core) wired on top of pares-radix-core, but pares-radix's split is
# still UNPUSHED locally. This [patch] redirects the git deps that crates/core
# references (pares-radix-core, pares-radix-praxis) to the local pares-radix
# checkout so the cognition crate compiles against the unpushed canonical code.
#
# S-F replaces this with a real published pin (and removes this block).
# ---------------------------------------------------------------------------
[patch."https://github.com/plures/pares-radix.git"]
pares-radix-core   = { path = "C:/Projects/pares-radix/crates/radix-core" }
pares-radix-praxis = { path = "C:/Projects/pares-radix/crates/praxis" }
# Stage S-D: the bitnet crates are now ported into THIS (pares-agens) workspace.
# Redirect the git references (pulled transitively + by agens-plugin's S-F pin)
# to the local ported copies so there is a single `links = "bitnet"` package and
# agens-plugin resolves against the import-flipped local bitnet. (Does not edit
# agens-plugin's pins — [patch] swaps the source transparently.)
pares-agens-bitnet-sys = { path = "C:/Projects/pares-agens/crates/bitnet-sys" }
pares-agens-bitnet     = { path = "C:/Projects/pares-agens/crates/bitnet" }

